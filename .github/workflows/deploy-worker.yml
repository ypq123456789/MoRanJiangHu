name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /
      VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
      VITE_GITHUB_BACKUP_CLIENT_ID: ${{ secrets.VITE_GITHUB_BACKUP_CLIENT_ID }}
      VITE_SYNC_API_BASE_URL: ${{ vars.VITE_SYNC_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate GitHub OAuth build env
        run: |
          if [ -z "${VITE_GITHUB_CLIENT_ID}" ]; then
            echo "::error::Missing required GitHub OAuth build secret: VITE_GITHUB_CLIENT_ID"
            exit 1
          fi

      - name: Build Worker bundle
        run: npm run worker:build

      # 生产 KV / D1 / Worker 都属于账号 B。凭据与账号不匹配时，wrangler 会在部署的
      # 最后一步才报 `KV namespace ... not found [code: 10041]`，前面的构建全部白跑。
      # 这里先 whoami 把实际生效的账号打出来，配错立刻失败。
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_API_KEY}" ] || [ -z "${CLOUDFLARE_EMAIL}" ]; then
            echo "::error::缺少 Cloudflare 凭据：需要 CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_API_KEY + CLOUDFLARE_EMAIL（生产账号 B 的 Global API Key）。"
            exit 1
          fi
          npx wrangler@4 whoami

      # 账号 B 使用的是 Global API Key（不是 API Token），因此这里只传 API_KEY + EMAIL。
      # 注意：wrangler 优先读 CLOUDFLARE_API_TOKEN，如果以后改用 scoped token，请加回该变量
      # 并同时移除 API_KEY/EMAIL，避免旧的失效 token 静默覆盖正确凭据。
      - name: Deploy to Cloudflare Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: npx wrangler@4 deploy
